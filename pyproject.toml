[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxymrpc"
version = "0.1.0"
description = "Yandex Music Discord Rich Presence for Linux"
requires-python = ">=3.12"
dependencies = [
    "textual",
    "pypresence",
    "yandex-music[ynison]",
    "dbus-next",
]

[project.scripts]
ymrpc = "ymrpc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
